name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Hata: GitHub repo Secrets bolumunde HF_TOKEN (Write yetkili) tanimli degil."
            exit 1
          fi
          git push --force "https://sahanfatih:${HF_TOKEN}@huggingface.co/spaces/sahanfatih/yazma-eser-paralel-tercume" main
